<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('설문 통계')}"></head>

<style>
  * { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; }
  .progress-bar { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
</style>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/api.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<body class="bg-gray-50 min-h-screen">

<!-- Thymeleaf 가 surveyId 를 JS 변수로 주입 -->
<script th:inline="javascript">
  const SVY_ID = /*[[${surveyId}]]*/ 0;
</script>

<div class="max-w-5xl mx-auto px-4 py-8" x-data="statisticsPage()" x-init="init()">

  <!-- 헤더 -->
  <header class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">설문 통계</h1>
    <div class="flex items-center gap-2">
      <button @click="openHistModal()"
              class="px-4 py-2 text-sm border border-gray-200 rounded-lg bg-white
                     hover:bg-gray-50 transition-colors">
        다운로드 이력
      </button>
      <button @click="downloadStatisticsExcel()"
              class="px-4 py-2 text-sm border border-gray-200 rounded-lg bg-white
                     hover:bg-gray-50 transition-colors">
        엑셀 다운로드
      </button>
    </div>
  </header>

  <!-- 탭 -->
  <nav class="flex gap-1 bg-white border border-gray-100 rounded-xl p-1 mb-5">
    <button class="flex-1 py-3 text-sm font-medium rounded-lg transition-colors"
            :class="ui.tab === 'overview' ? 'bg-orange-500 text-white' : 'text-gray-500 hover:bg-gray-50'"
            @click="selectTab('overview')">
      응답 결과 조회
    </button>
    <button class="flex-1 py-3 text-sm font-medium rounded-lg transition-colors"
            :class="ui.tab === 'questions' ? 'bg-orange-500 text-white' : 'text-gray-500 hover:bg-gray-50'"
            @click="selectTab('questions')">
      문항별 응답현황
    </button>
    <button class="flex-1 py-3 text-sm font-medium rounded-lg transition-colors"
            :class="ui.tab === 'respondents' ? 'bg-orange-500 text-white' : 'text-gray-500 hover:bg-gray-50'"
            @click="selectTab('respondents')">
      응답자별 문항답변
    </button>
  </nav>

  <!-- 로딩 -->
  <div x-show="ui.isLoading" class="text-center py-20 text-gray-400 text-sm">
    불러오는 중…
  </div>

  <!-- 본문 -->
  <div x-show="!ui.isLoading">

    <!-- ─────────── 설문 기본정보 요약 (모든 탭 공통) ─────────── -->
    <section class="bg-white border border-gray-100 rounded-xl p-5 mb-5">
      <h2 class="text-base font-semibold text-gray-900 mb-3">설문 기본정보 요약</h2>

      <p class="text-sm text-gray-700 font-medium mb-4">
        <span x-text="summary.title"></span>
        <span class="text-gray-300 mx-1.5">·</span>
        <span class="text-gray-500" x-text="formatDateRange(summary.beginDate, summary.endDate)"></span>
        <span class="text-gray-300 mx-1.5">·</span>
        <span class="text-gray-500" x-text="summary.site"></span>
      </p>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <!-- 총 대상자 -->
        <div class="bg-gray-50 rounded-lg px-4 py-4 text-center">
          <p class="text-xs text-gray-500 mb-1">총 대상자</p>
          <p class="text-2xl font-bold text-gray-900">
            <span x-text="summary.totalTargetCount.toLocaleString()"></span>
            <span class="text-sm font-normal text-gray-400 ml-0.5">명</span>
          </p>
        </div>
        <!-- 응답 완료 -->
        <div class="bg-gray-50 rounded-lg px-4 py-4 text-center">
          <p class="text-xs text-gray-500 mb-1">응답 완료</p>
          <p class="text-2xl font-bold text-gray-900">
            <span x-text="summary.respondedCount.toLocaleString()"></span>
            <span class="text-sm font-normal text-gray-400 ml-0.5">명</span>
          </p>
        </div>
        <!-- 응답률 (강조) -->
        <div class="bg-orange-50 rounded-lg px-4 py-4 text-center">
          <p class="text-xs text-orange-600 mb-1">응답률</p>
          <p class="text-2xl font-bold text-orange-500">
            <span x-text="summary.responseRate"></span>
            <span class="text-sm font-normal ml-0.5">%</span>
          </p>
        </div>
        <!-- 미응답 -->
        <div class="bg-gray-50 rounded-lg px-4 py-4 text-center">
          <p class="text-xs text-gray-500 mb-1">미응답</p>
          <p class="text-2xl font-bold text-gray-900">
            <span x-text="summary.notRespondedCount.toLocaleString()"></span>
            <span class="text-sm font-normal text-gray-400 ml-0.5">명</span>
          </p>
        </div>
      </div>

      <p class="text-xs text-gray-500">
        마감까지 <span class="text-orange-500 font-semibold" x-text="summary.daysLeft + '일'"></span> 남음
        <span class="text-gray-300 mx-2">·</span>
        총 문항 수: <span class="text-gray-700" x-text="summary.totalQuestionCount + '문항'"></span>
      </p>
    </section>

    <!-- ─────────── [탭1] 응답 결과 조회 — 조직별 응답률 ─────────── -->
    <section x-show="ui.tab === 'overview'" class="bg-white border border-gray-100 rounded-xl p-5">
      <h2 class="text-base font-semibold text-gray-900 mb-5">응답 결과 조회</h2>

      <!-- 헤더 라인 -->
      <div class="grid grid-cols-12 gap-3 text-xs text-gray-400 px-2 pb-2 border-b border-gray-100">
        <div class="col-span-2">조직명</div>
        <div class="col-span-7">응답률</div>
        <div class="col-span-1 text-right">비율</div>
        <div class="col-span-2 text-right">응답수</div>
      </div>

      <!-- 부서별 행 — init() 에서 flatDeptRows 로 미리 평탄화. 자식 행은 x-show 로 가시성 제어. -->
      <div class="divide-y divide-gray-50">
        <template x-for="row in flatDeptRows" :key="row._kind + '-' + row.deptId">
          <div class="grid grid-cols-12 gap-3 items-center px-2"
               :class="row._kind === 'parent'
                       ? (row.children && row.children.length > 0 ? 'py-3.5 cursor-pointer hover:bg-gray-50' : 'py-3.5')
                       : 'py-2.5 bg-gray-50/40'"
               x-show="row._kind === 'parent' || isDeptExpanded(row._parentDeptId)"
               @click="onRowClick(row)">

            <!-- 조직명 (+ 부모일 때 펼치기 아이콘) -->
            <div :class="row._kind === 'parent'
                         ? 'col-span-2 text-sm text-gray-700 font-semibold flex items-center gap-1'
                         : 'col-span-2 pl-6 text-xs text-gray-500'">
              <span class="text-xs text-gray-400 w-3"
                    x-text="(row._kind === 'parent' && row.children && row.children.length > 0)
                            ? (isDeptExpanded(row.deptId) ? '▼' : '▶')
                            : ''"></span>
              <span x-text="row.deptName"></span>
            </div>

            <!-- 진행률 바 -->
            <div class="col-span-7">
              <div :class="row._kind === 'parent'
                           ? 'h-2.5 bg-gray-100 rounded-full overflow-hidden'
                           : 'h-2 bg-gray-100 rounded-full overflow-hidden'">
                <div class="h-full rounded-full progress-bar"
                     :class="barColor(row)"
                     :style="`width: ${row.responseRate}%`"></div>
              </div>
            </div>

            <!-- 비율 -->
            <div class="col-span-1 text-right font-semibold"
                 :class="(row._kind === 'parent' ? 'text-sm ' : 'text-xs ')
                         + (row.lowRate ? 'text-gray-400'
                            : (row._kind === 'parent' ? 'text-orange-500' : 'text-orange-400'))"
                 x-text="row.responseRate + '%'"></div>

            <!-- 응답수 / 대상자 -->
            <div class="col-span-2 text-right text-xs text-gray-400"
                 x-text="row.respondedCount + '/' + row.targetCount + '명'"></div>
          </div>
        </template>

        <!-- 빈 상태 -->
        <div x-show="flatDeptRows.length === 0" class="text-center py-10 text-gray-400 text-sm">
          조회된 조직이 없습니다.
        </div>
      </div>

      <p class="text-xs text-gray-300 text-right mt-4">
        기준: 응답률 70% 미만 조직은 회색 표시
      </p>
    </section>

    <!-- ─────────── [탭2] 문항별 응답현황 ─────────── -->
    <section x-show="ui.tab === 'questions'">

      <div class="flex items-center justify-between mb-4 px-1">
        <h2 class="text-base font-semibold text-gray-900">문항별 응답현황</h2>
        <div class="flex items-center gap-3">
          <p class="text-xs text-gray-400" x-show="aggregatedAt">
            최종 집계: <span x-text="formatAggregatedAt(aggregatedAt)"></span>
          </p>
          <button @click="runBatchManually()"
                  :disabled="ui.batchRunning"
                  class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg
                         border border-orange-200 text-orange-500 bg-white
                         hover:bg-orange-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
            <span x-show="ui.batchRunning"
                  class="w-3 h-3 border border-orange-400 border-t-transparent rounded-full animate-spin"></span>
            <span x-text="ui.batchRunning ? '집계 중…' : '수동 집계'"></span>
          </button>
        </div>
      </div>

      <!-- 로딩 -->
      <div x-show="ui.questionsLoading" class="bg-white border border-gray-100 rounded-xl p-10 text-center text-gray-400 text-sm">
        불러오는 중…
      </div>

      <!-- 빈 상태 (배치 미실행 또는 응답 없음) -->
      <div x-show="!ui.questionsLoading && questionStats.length === 0"
           class="bg-white border border-gray-100 rounded-xl p-10 text-center text-gray-400 text-sm">
        아직 집계된 데이터가 없습니다.
      </div>

      <!-- 문항 카드 리스트 -->
      <div x-show="!ui.questionsLoading && questionStats.length > 0" class="space-y-4">
        <template x-for="(q, idx) in questionStats" :key="q.questionId">
          <div class="bg-white border border-gray-100 rounded-xl p-5">

            <!-- 카드 헤더 -->
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2 py-0.5 bg-orange-50 text-orange-500 text-xs font-medium rounded">
                문항 <span x-text="idx + 1"></span>
              </span>
            </div>
            <h3 class="text-base font-semibold text-gray-900 mb-1" x-text="q.title"></h3>
            <p class="text-xs text-gray-400 mb-4">
              <span x-text="questionTypeLabel(q.questionType)"></span>
              <span class="text-gray-300 mx-1.5">·</span>
              응답 <span x-text="q.totalResponseCount.toLocaleString()"></span>명
              <template x-if="q.average !== null && q.average !== undefined">
                <span>
                  <span class="text-gray-300 mx-1.5">·</span>
                  평균 <span class="text-gray-700 font-medium" x-text="q.average + '점'"></span>
                </span>
              </template>
            </p>

            <!-- SINGLE_CHOICE / MULTIPLE_CHOICE / RANKING — 가로 막대 -->
            <template x-if="['SINGLE_CHOICE', 'MULTIPLE_CHOICE', 'RANKING'].includes(q.questionType)">
              <div class="space-y-2.5">
                <template x-for="(item, i) in q.items" :key="i">
                  <div class="grid grid-cols-12 gap-3 items-center">
                    <div class="col-span-3 text-sm text-gray-700" x-text="item.label"></div>
                    <div class="col-span-7">
                      <div class="h-2.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full rounded-full bg-orange-400 progress-bar"
                             :style="`width: ${item.percentage}%`"></div>
                      </div>
                    </div>
                    <div class="col-span-1 text-right text-sm text-gray-700"
                         x-text="item.count.toLocaleString() + '명'"></div>
                    <div class="col-span-1 text-right text-xs text-gray-400"
                         x-text="item.percentage + '%'"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- SCALE — 점수별 카드 (높은 점수부터 표시, 첫 카드 강조) -->
            <template x-if="q.questionType === 'SCALE'">
              <div class="grid gap-2" :style="`grid-template-columns: repeat(${q.items.length}, minmax(0, 1fr))`">
                <template x-for="(item, i) in [...q.items].reverse()" :key="i">
                  <div class="rounded-lg px-3 py-4 text-center"
                       :class="i === 0 ? 'bg-orange-50' : 'bg-gray-50'">
                    <p class="text-2xl mb-1" x-text="scaleEmoji(i, q.items.length)"></p>
                    <p class="text-xs text-gray-500 mb-1" x-text="item.label"></p>
                    <p class="text-base font-bold"
                       :class="i === 0 ? 'text-orange-500' : 'text-gray-900'"
                       x-text="item.percentage + '%'"></p>
                  </div>
                </template>
              </div>
            </template>

            <!-- SUBJECTIVE — 응답 수만 -->
            <template x-if="q.questionType === 'SUBJECTIVE'">
              <div>
                <div class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-3 text-sm text-gray-500">
                  <span>응답 <span class="text-gray-700 font-medium"
                                 x-text="q.totalResponseCount.toLocaleString() + '건'"></span></span>
                  <button x-show="q.sampleTexts && q.sampleTexts.length > 0"
                          @click="q.textOpen = !q.textOpen"
                          class="text-xs font-medium text-orange-500 hover:text-orange-600">
                    <span x-text="q.textOpen ? '닫기' : '답변 보기'"></span>
                  </button>
                </div>
                <div x-show="q.textOpen" class="mt-2 space-y-2">
                  <template x-for="(text, i) in q.sampleTexts" :key="i">
                    <div class="bg-gray-50 rounded-lg px-4 py-2.5 text-sm text-gray-700" x-text="text"></div>
                  </template>
                  <p x-show="q.sampleTexts && q.sampleTexts.length >= 30"
                     class="text-xs text-gray-400 text-center pt-1">최대 30건까지 표시됩니다</p>
                </div>
              </div>
            </template>

          </div>
        </template>
      </div>
    </section>
    <!-- ─────────── [탭3] 응답자별 문항답변 ─────────── -->
    <section x-show="ui.tab === 'respondents'" class="bg-white border border-gray-100 rounded-xl p-5">

      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-gray-900">응답자별 문항답변</h2>
        <p class="text-xs text-gray-400" x-show="!ui.respondentsLoading && responseTotal > 0">
          전체 <span class="text-gray-700 font-medium" x-text="responseTotal.toLocaleString()"></span>건 중
          최근 <span class="text-gray-700 font-medium" x-text="Math.min(responseTotal, previewLimit).toLocaleString()"></span>건 표시
        </p>
      </div>

      <!-- 로딩 -->
      <div x-show="ui.respondentsLoading" class="text-center py-10 text-gray-400 text-sm">
        불러오는 중…
      </div>

      <!-- 빈 상태 -->
      <div x-show="!ui.respondentsLoading && responses.length === 0"
           class="text-center py-10 text-gray-400 text-sm">
        아직 응답이 없습니다.
      </div>

      <!-- 테이블 -->
      <div x-show="!ui.respondentsLoading && responses.length > 0" class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
          <tr class="text-xs text-gray-400 border-b border-gray-100">
            <!-- 좌측 고정 컬럼 -->
            <th class="sticky left-0 bg-white text-left font-normal px-3 py-2 min-w-[100px]">응답자</th>
            <th class="sticky left-[100px] bg-white text-left font-normal px-3 py-2 min-w-[120px]">부서</th>
            <!-- 동적 문항 컬럼 -->
            <template x-for="q in questions" :key="q.questionId">
              <th class="text-left font-normal px-3 py-2 min-w-[140px]" x-text="q.questionName"></th>
            </template>
          </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
          <template x-for="(r, idx) in responses" :key="idx">
            <tr class="hover:bg-gray-50">
              <!-- 좌측 고정 컬럼 -->
              <td class="sticky left-0 bg-white px-3 py-3 font-medium text-gray-900" x-text="r.empName"></td>
              <td class="sticky left-[100px] bg-white px-3 py-3 text-gray-600" x-text="r.deptName"></td>
              <!-- 답변 셀 -->
              <template x-for="q in questions" :key="q.questionId">
                <td class="px-3 py-3 text-gray-700 align-top">
                  <span x-html="renderAnswer(r, q)"></span>
                </td>
              </template>
            </tr>
          </template>
          </tbody>
        </table>
      </div>
    </section>

  </div><!-- /본문 -->

  <!-- ─────────── 다운로드 이력 모달 ─────────── -->
  <div x-show="hist.open"
       class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
       x-transition.opacity>
    <div class="bg-white rounded-2xl w-full max-w-lg mx-4 flex flex-col"
         style="max-height: 85vh;"
         @click.stop>

      <!-- 모달 헤더 -->
      <div class="flex items-center justify-between px-6 pt-6 pb-4 border-b border-gray-100">
        <h2 class="text-lg font-bold text-gray-900">이력 확인</h2>
        <button @click="closeHistModal()"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100
                       hover:bg-gray-200 text-gray-500 transition-colors">✕</button>
      </div>

      <!-- 탭 -->
      <div class="flex gap-2 px-6 py-4">
        <button @click="hist.tab = 'excel'"
                :class="hist.tab === 'excel' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-500'"
                class="px-4 py-1.5 text-sm font-medium rounded-full transition-colors">
          응답 내보내기 이력
        </button>
        <button @click="hist.tab = 'notif'"
                :class="hist.tab === 'notif' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-500'"
                class="px-4 py-1.5 text-sm font-medium rounded-full transition-colors">
          알림 발송 이력
        </button>
      </div>

      <!-- 테이블 헤더 -->
      <div class="grid grid-cols-12 gap-2 text-xs text-gray-400 px-6 py-3 border-b border-gray-100">
        <div class="col-span-1">No.</div>
        <div class="col-span-3">이름</div>
        <div class="col-span-4">팀 명</div>
        <div class="col-span-4">날짜</div>
      </div>

      <!-- 무한스크롤 목록 -->
      <div class="overflow-y-auto flex-1 px-6"
           @scroll="onHistScroll($event)">

        <!-- [엑셀 탭] -->
        <template x-if="hist.tab === 'excel'">
          <div>
            <div x-show="!hist.loading && hist.items.length === 0"
                 class="text-center py-16 text-gray-400 text-sm">
              다운로드 이력이 없습니다.
            </div>
            <template x-for="(item, i) in hist.items" :key="i">
              <div class="grid grid-cols-12 gap-2 items-center py-3.5 border-b border-gray-50 text-sm">
                <div class="col-span-1 text-gray-400 text-xs" x-text="hist.totalCount - i"></div>
                <div class="col-span-3">
                  <span class="px-2 py-0.5 bg-orange-50 text-orange-500 text-xs rounded"
                        x-text="item.empName"></span>
                </div>
                <div class="col-span-4 text-orange-500 font-medium text-xs" x-text="item.deptName"></div>
                <div class="col-span-4 text-gray-500 text-xs" x-text="formatHistDate(item.downloadedAt)"></div>
              </div>
            </template>
          </div>
        </template>

        <!-- [알림 탭] — 추후 구현 -->
        <template x-if="hist.tab === 'notif'">
          <div class="text-center py-16 text-gray-400 text-sm">
            준비 중입니다.
          </div>
        </template>

        <!-- 로딩 -->
        <div x-show="hist.loading" class="text-center py-4 text-gray-400 text-xs">
          불러오는 중…
        </div>
      </div>

      <!-- 닫기 -->
      <div class="px-6 py-4 border-t border-gray-100 flex justify-end">
        <button @click="closeHistModal()"
                class="px-6 py-2.5 bg-orange-500 text-white text-sm font-medium rounded-lg
                       hover:bg-orange-600 transition-colors">
          닫기
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  function statisticsPage() {
    return {
      ui: {
        tab: 'overview',
        isLoading: true,
        respondentsLoading: false,
        respondentsLoaded: false,
        questionsLoading: false,
        questionsLoaded: false,
        batchRunning: false
      },
      summary: {
        title: '', site: '', beginDate: '', endDate: '',
        totalQuestionCount: 0, totalTargetCount: 0,
        respondedCount: 0, notRespondedCount: 0,
        responseRate: 0, daysLeft: 0
      },
      deptRates: [],
      flatDeptRows: [],      // init 에서 buildFlatRows() 결과 캐싱 — template x-for 가 직접 참조
      expandedDeptIds: [],   // 펼쳐진 상위 부서 ID 목록
      questions: [],
      responses: [],
      responseTotal: 0,
      previewLimit: 50,
      questionStats: [],
      aggregatedAt: null,
      hist: {
        open: false,
        tab: 'excel',
        loading: false,
        items: [],
        page: 0,
        hasMore: true,
        totalCount: 0
      },

      async init() {
        console.log('[DBG-1] init() 시작');

        // 'after' 에러를 정확히 잡기 위한 전역 핸들러
        if (!window.__deptDbgErrInstalled) {
          window.__deptDbgErrInstalled = true;
          window.addEventListener('error', (ev) => {
            console.error('[DBG-ERR] window.error:', ev.message);
            console.error('[DBG-ERR] stack:', ev.error && ev.error.stack);
          });
          window.addEventListener('unhandledrejection', (ev) => {
            console.error('[DBG-ERR] unhandledrejection:', ev.reason);
          });
        }

        try {
          // 두 API 동시 호출
          const [summaryRes, deptsRes] = await Promise.all([
            api.get(`/api/internal/v1/surveys/${SVY_ID}/statistics/summary`, { baseURL: '' }),
            api.get(`/api/internal/v1/surveys/${SVY_ID}/statistics/depts`, { baseURL: '' })
          ]);
          console.log('[DBG-2] API 응답 도착');
          console.log('[DBG-2a] deptsRes.status =', deptsRes.status);
          console.log('[DBG-2b] deptsRes.data =', deptsRes.data);
          console.log('[DBG-2c] deptsRes.data.data =', deptsRes.data && deptsRes.data.data);
          console.log('[DBG-2d] isArray(deptsRes.data.data) =', Array.isArray(deptsRes.data && deptsRes.data.data));

          const depts = deptsRes.data.data || [];
          console.log('[DBG-3] depts 로컬 변수:', depts, 'length:', depts.length);

          this.summary = summaryRes.data.data;
          this.deptRates = depts;
          console.log('[DBG-4] this.deptRates 할당 완료');

          const flat = this.buildFlatRows(depts);
          console.log('[DBG-5] buildFlatRows 결과 length:', flat.length, ' rows:', flat);

          this.flatDeptRows = flat;
          console.log('[DBG-6] this.flatDeptRows 할당 완료. 현재 값 length:', this.flatDeptRows.length);

          this.expandedDeptIds = depts
              .filter(d => d.children && d.children.length > 0)
              .map(d => d.deptId);
          console.log('[DBG-7] expandedDeptIds:', this.expandedDeptIds);
        } catch (e) {
          console.error('[DBG-CATCH] init() 예외 메시지:', e && e.message);
          console.error('[DBG-CATCH] init() 예외 스택:', e && e.stack);
          console.error('[statistics] 조회 실패:', e);
          alert('통계 데이터를 불러오지 못했습니다.');
        } finally {
          this.ui.isLoading = false;
          console.log('[DBG-8] init() 종료. final this.flatDeptRows length:',
                      (this.flatDeptRows && this.flatDeptRows.length));
        }
      },

      /**
       * 탭 전환 — 응답자별 / 문항별 탭은 진입 시 lazy load
       */
      selectTab(tab) {
        this.ui.tab = tab;
        if (tab === 'respondents' && !this.ui.respondentsLoaded) {
          this.loadRespondents();
        }
        if (tab === 'questions' && !this.ui.questionsLoaded) {
          this.loadQuestionStatistics();
        }
      },

      /** 응답자별 문항답변 조회 */
      async loadRespondents() {
        this.ui.respondentsLoading = true;
        try {
          const res = await api.get(`/api/internal/v1/surveys/${SVY_ID}/statistics/responses`, { baseURL: '' });
          const data = res.data.data;
          this.questions = data.questions;
          this.responses = data.responses;
          this.responseTotal = data.totalCount;
          this.previewLimit = data.previewLimit;
          this.ui.respondentsLoaded = true;
        } catch (e) {
          console.error('[statistics] 응답자별 문항답변 조회 실패:', e);
          alert('응답자별 문항답변을 불러오지 못했습니다.');
        } finally {
          this.ui.respondentsLoading = false;
        }
      },

      /** 문항별 응답현황 조회 (배치 집계 결과) */
      async loadQuestionStatistics() {
        this.ui.questionsLoading = true;
        try {
          const res = await api.get(`/api/internal/v1/surveys/${SVY_ID}/statistics/questions`, { baseURL: '' });
          const data = res.data.data;
          this.questionStats = data.questions.map(q => ({ ...q, textOpen: false }));
          this.aggregatedAt = data.aggregatedAt;
          this.ui.questionsLoaded = true;
        } catch (e) {
          console.error('[statistics] 문항별 응답현황 조회 실패:', e);
          alert('문항별 응답현황을 불러오지 못했습니다.');
        } finally {
          this.ui.questionsLoading = false;
        }
      },

      /** 수동 집계 실행 */
      async runBatchManually() {
        this.ui.batchRunning = true;
        try {
          await api.post('/api/internal/v1/admin/batch/statistics/run', null, { baseURL: '', timeout: 60000 });
          this.ui.questionsLoaded = false;
          await this.loadQuestionStatistics();
        } catch (e) {
          console.error('[statistics] 수동 집계 실패:', e);
          alert('집계 실행에 실패했습니다.');
        } finally {
          this.ui.batchRunning = false;
        }
      },

      /**
       * 응답 1셀 렌더링 — 문항 타입별로 분기
       * - SINGLE_CHOICE / SCALE     : 항목 1개 → 라벨
       * - MULTIPLE_CHOICE           : 여러 항목 → 줄바꿈
       * - SUBJECTIVE                : textAnswer 그대로
       * - RANKING                   : 순서대로 "1. 라벨" 형태
       * - 미응답                    : "-" (회색)
       */
      renderAnswer(respondent, question) {
        const ans = respondent.answers.find(a => a.questionId === question.questionId);
        if (!ans) return '<span class="text-gray-300">-</span>';

        const escape = (s) => String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        const itemMap = Object.fromEntries(question.items.map(i => [i.itemId, i.itemName]));
        const labelOf = (id) => itemMap[id] ?? `(삭제됨)`;

        switch (ans.type) {
          case 'SINGLE_CHOICE':
            return escape(labelOf(ans.selectedItemIds?.[0]));

          case 'MULTIPLE_CHOICE':
            return (ans.selectedItemIds ?? [])
                .map(id => escape(labelOf(id)))
                .join('<br>');

          case 'SUBJECTIVE':
            return escape(ans.textAnswer);

          case 'SCALE': {
            // scaleValue 는 선택지 정렬 순서 점수(1~N) → 해당 순서의 itemName 표시
            const opt = question.items[ans.scaleValue - 1];
            return opt ? escape(opt.itemName) : '<span class="text-gray-300">-</span>';
          }

          case 'RANKING':
            return (ans.rankedItemIds ?? [])
                .map((id, i) => `${i + 1}. ${escape(labelOf(id))}`)
                .join('<br>');

          default:
            return '<span class="text-gray-300">-</span>';
        }
      },

      /** 트리(부모 + children) → 평면 배열로 변환. _kind 마커로 부모/자식 구분. */
      buildFlatRows(rootNodes) {
        console.log('[DBG-BF1] buildFlatRows 호출. rootNodes:', rootNodes,
                    ' isArray:', Array.isArray(rootNodes));
        const rows = [];
        for (const dept of rootNodes || []) {
          if (!dept || typeof dept !== 'object') {
            console.warn('[DBG-BF-WARN] dept 가 객체 아님:', dept);
            continue;
          }
          rows.push({ ...dept, _kind: 'parent' });
          for (const child of dept.children || []) {
            rows.push({ ...child, _kind: 'child', _parentDeptId: dept.deptId });
          }
        }
        console.log('[DBG-BF2] buildFlatRows 종료. rows.length:', rows.length);
        return rows;
      },

      /** 상위 부서 펼침 여부 */
      isDeptExpanded(deptId) {
        return this.expandedDeptIds.includes(deptId);
      },

      /** 상위 부서 펼치기/접기 토글 — 새 배열 재할당으로 reactivity 보장 */
      toggleDept(deptId) {
        if (this.isDeptExpanded(deptId)) {
          this.expandedDeptIds = this.expandedDeptIds.filter(id => id !== deptId);
        } else {
          this.expandedDeptIds = [...this.expandedDeptIds, deptId];
        }
      },

      /** row 한 줄 클릭 — 부모이면서 children 있을 때만 토글 */
      onRowClick(row) {
        if (row._kind === 'parent' && row.children && row.children.length > 0) {
          this.toggleDept(row.deptId);
        }
      },

      /**
       * 응답률에 따라 막대 색상 분기
       * - lowRate(응답률 70% 미만) → 회색
       * - 그 외 응답률 구간별로 진한/연한 오렌지로 강약
       */
      barColor(d) {
        if (d.lowRate) return 'bg-gray-300';
        if (d.responseRate >= 80) return 'bg-orange-500';
        if (d.responseRate >= 60) return 'bg-orange-400';
        return 'bg-orange-300';
      },

      /** "2026.03.18 ~ 03.25" 형태 — 같은 연/월이면 뒷부분 축약 */
      formatDateRange(begin, end) {
        if (!begin || !end) return '';
        const b = new Date(begin);
        const e = new Date(end);
        const pad = (n) => String(n).padStart(2, '0');
        const left = `${b.getFullYear()}.${pad(b.getMonth() + 1)}.${pad(b.getDate())}`;
        const right = (b.getFullYear() === e.getFullYear() && b.getMonth() === e.getMonth())
            ? `${pad(e.getDate())}`
            : `${e.getFullYear()}.${pad(e.getMonth() + 1)}.${pad(e.getDate())}`;
        return `${left} ~ ${right}`;
      },

      /** 문항 타입 한글 라벨 */
      questionTypeLabel(type) {
        return ({
          SINGLE_CHOICE:   '단일선택',
          MULTIPLE_CHOICE: '복수선택',
          SUBJECTIVE:      '주관식',
          SCALE:           '척도',
          RANKING:         '순위선택'
        })[type] ?? type;
      },

      /**
       * SCALE 카드 이모지 — 화면은 높은 점수→낮은 점수 순서로 표시되므로
       *   index 0 = 최고점(매우 만족), index N-1 = 최저점(매우 불만)
       * 옵션 개수에 관계없이 "긍정 → 부정" 점층으로 매핑
       */
      scaleEmoji(index, total) {
        const positions = ['😀', '🙂', '😐', '🙁', '😢'];
        if (total <= 1) return positions[0];
        // index 0 → 0(최고), index N-1 → 4(최저) 로 매핑
        const ratio = index / (total - 1);
        const idx = Math.round(ratio * (positions.length - 1));
        return positions[idx];
      },

      /** 집계 시각 — "N분 전 / N시간 전 / YYYY.MM.DD HH:mm" */
      formatAggregatedAt(iso) {
        if (!iso) return '';
        const t = new Date(iso);
        const diffMin = Math.floor((Date.now() - t.getTime()) / 60000);
        if (diffMin < 1)  return '방금 전';
        if (diffMin < 60) return `${diffMin}분 전`;
        const diffHr = Math.floor(diffMin / 60);
        if (diffHr < 24)  return `${diffHr}시간 전`;
        const pad = (n) => String(n).padStart(2, '0');
        return `${t.getFullYear()}.${pad(t.getMonth() + 1)}.${pad(t.getDate())} `
             + `${pad(t.getHours())}:${pad(t.getMinutes())}`;
      },

      /**
       * 통계 엑셀 다운로드 — 현재까지 구현된 시트들을 단일 .xlsx 로 받음
       * - 응답: xlsx 바이너리 (responseType: 'blob' 필수)
       * - 파일명: 서버 Content-Disposition 헤더에서 추출 (RFC 5987 UTF-8)
       */
      async downloadStatisticsExcel() {
        try {
          const res = await api.get(
              `/api/internal/v1/surveys/${SVY_ID}/statistics/export`,
              { baseURL: '', responseType: 'blob' }
          );

          const filename = this.parseFilename(res.headers['content-disposition'])
              ?? 'statistics.xlsx';

          const url = URL.createObjectURL(new Blob([res.data]));
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (e) {
          console.error('[statistics] 엑셀 다운로드 실패:', e);
          alert('엑셀 파일을 다운로드하지 못했습니다.');
        }
      },

      /**
       * Content-Disposition 에서 파일명 추출
       * - filename* (RFC 5987 UTF-8) 우선, 없으면 filename 폴백
       */
      parseFilename(header) {
        if (!header) return null;
        const utf8 = header.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
        if (utf8) {
          try { return decodeURIComponent(utf8[1]); } catch (_) { /* fallthrough */ }
        }
        const ascii = header.match(/filename\s*=\s*"?([^";]+)"?/i);
        return ascii ? ascii[1] : null;
      },

      async openHistModal() {
        this.hist.open = true;
        if (this.hist.items.length === 0) await this.loadHist();
      },

      closeHistModal() {
        this.hist.open = false;
      },

      async loadHist() {
        if (this.hist.loading || !this.hist.hasMore) return;
        this.hist.loading = true;
        try {
          const res = await api.get(
            `/api/internal/v1/surveys/${SVY_ID}/statistics/export/history`,
            { baseURL: '', params: { page: this.hist.page } }
          );
          const data = res.data.data;
          if (this.hist.page === 0) this.hist.totalCount = data.totalCount;
          this.hist.items.push(...data.content);
          this.hist.hasMore = data.hasNext;
          this.hist.page++;
        } catch (e) {
          console.error('[hist] 이력 조회 실패:', e);
        } finally {
          this.hist.loading = false;
        }
      },

      onHistScroll(e) {
        const el = e.target;
        if (el.scrollHeight - el.scrollTop - el.clientHeight < 80) {
          this.loadHist();
        }
      },

      /** "2026.03.25 10:00" 형태 */
      formatHistDate(iso) {
        if (!iso) return '';
        const t = new Date(iso);
        const pad = n => String(n).padStart(2, '0');
        return `${t.getFullYear()}.${pad(t.getMonth()+1)}.${pad(t.getDate())} `
             + `${pad(t.getHours())}:${pad(t.getMinutes())}`;
      }
    }
  }
</script>
